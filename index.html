<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Painted Heart - Comic Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bd-cover-scene">

    <section id="home-screen" class="active-section">
        <div class="background-alley">
            <img src="img/back-bd.png" alt="Brussels City" id="bg-image">
        </div>
        <main class="bd-cover">
            <div class="cover-header">
                <h1 id="main-title">THE PAINTED HEART</h1>
                <p id="sub-title">Explore the streets of Brussels and play your part</p>
            </div>
            <div class="cover-illustration"></div>
            <div class="cover-footer">
                <button id="start-btn">START EXPLORING</button>
            </div>
        </main>
    </section>

    <section id="explorer-screen" class="hidden-section">
        <header class="explorer-header">
            <div class="header-title-box">
                <h1 id="explorer-title" title="Return to Home & Reset Filters">Brussels Explorer</h1>
            </div>
            
            <div class="filter-zone">
                <select id="lang-select">
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="nl">Nederlands</option>
                </select>
                
                <input type="text" id="search-input" placeholder="Search for a comic...">
                <select id="commune-select">
                    <option value="">All municipalities</option>
                </select>
            </div>

            <div class="header-actions">
                <button id="global-theme-toggle" title="Toggle Dark Mode">🌙</button>
                <button id="favorites-btn">❤️ Favorites</button>
                <button id="scrapbook-btn">📖 Scrapbook</button>
            </div>
        </header>
        <div id="gallery-container"></div>
    </section>

    <section id="scrapbook-screen" class="hidden-section">
        <header class="scrapbook-header">
            <h1 class="comic-title" id="scrap-main-title">MY SCRAPBOOK 💥</h1>
        
            <div class="header-actions">
                <button id="scrap-theme-toggle" class="theme-toggle" title="Toggle Dark Mode">🌙</button>
                <button id="back-btn">← Back</button>
            </div>
        </header>
        <div id="scrapbook-container"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
